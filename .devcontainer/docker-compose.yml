services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ..:/workspaces/BE-Asado:cached
    # Mantiene el container vivo; los comandos los corrés vos desde la terminal de VS Code
    command: sleep infinity
    depends_on:
      - mongo
    # Ojo: no seteamos DATABASE_URL acá. dotenv NO pisa variables ya definidas,
    # así que si la pusiéramos acá ignoraría la de tu .env.

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
