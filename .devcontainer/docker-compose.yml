services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ..:/workspaces/BE-Asado:cached
      # Persiste config, login e historial de chats de Claude Code entre rebuilds del container
      - claude-config:/home/node/.claude
    environment:
      # Hace que Claude guarde también .claude.json dentro del volumen (si no, queda en ~/.claude.json y se pierde)
      CLAUDE_CONFIG_DIR: /home/node/.claude
    # Mantiene el container vivo; los comandos los corrés vos desde la terminal de VS Code
    command: sleep infinity
    depends_on:
      mongo:
        condition: service_healthy
    # Ojo: no seteamos DATABASE_URL acá. dotenv NO pisa variables ya definidas,
    # así que si la pusiéramos acá ignoraría la de tu .env.

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Replica set de un nodo: deleteEvent usa transacciones, que no funcionan en
    # un Mongo standalone. El healthcheck inicializa el replica set la primera vez.
    # Desde el host (Compass, puerto 27017) conectar con ?directConnection=true.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  claude-config:
